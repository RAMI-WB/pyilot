services:
  - type: web
    name: pyilot
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pyilot-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true

databases:
  - name: pyilot-db
    plan: free
    databaseName: pyilot
    user: pyilot_user
